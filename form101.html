<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-xl mx-auto p-6 bg-white rounded-lg shadow mt-8">
        <h2 class="text-2xl font-bold mb-2">ร้านค้าขายของที่ระลึก</h2>
        <p class="mb-4">สาขาวิทยาการคอมพิวเตอร์</p>
        <p class="mb-6 text-sm text-gray-500">admin สำหรับจัดเตรียมสินค้า</p>

        <form action="" method="post" enctype="multipart/form-data" class="space-y-4">
            <h1 class="text-xl font-semibold mb-2">เสื้อ</h1>
            <div>
                <label for="productsize" class="block mb-1 font-medium">ขนาด</label>
                <select name="product-size" id="productsize" class="w-full border rounded px-3 py-2">
                    <option value="">-- กรุณาเลือกขนาด --</option>
                    <option value="xs">XS</option>
                    <option value="s">S</option>
                    <option value="m" selected>M</option>
                    <option value="l">L</option>
                    <option value="xl">XL</option>
                    <option value="2xl">2XL</option>
                    <option value="3xl">3XL</option>
                </select>
            </div>

            <div>
                <span class="block mb-1 font-medium">สี</span>
                <label class="mr-4"><input type="radio" name="prdcolor" value="white" class="mr-1">ขาว</label>
                <label class="mr-4"><input type="radio" name="prdcolor" value="bllack" class="mr-1">ดำ</label>
                <label class="mr-4"><input type="radio" name="prdcolor" value="blue" class="mr-1">น้ำเงิน</label>
                <label><input type="radio" name="prdcolor" value="gray" class="mr-1">เทา</label>
            </div>

            <div>
                <label for="price" class="block mb-1 font-medium">ราคา</label>
                <input type="number" name="price" id="price" value="100" min="0" max="1000" step="10" class="w-full border rounded px-3 py-2">
            </div>

            <div>
                <label for="quantity" class="block mb-1 font-medium">จำนวน</label>
                <input type="number" name="quantity" id="quantity" class="w-full border rounded px-3 py-2">
            </div>

            <div>
                <label for="model" class="block mb-1 font-medium">ชื่อรุ่น</label>
                <input type="text" name="model" id="model" placeholder="ชื่อรุ่น" class="w-full border rounded px-3 py-2">
            </div>

            <div>
                <label for="description" class="block mb-1 font-medium">รายละเอียด</label>
                <textarea name="description" id="description" placeholder="รายละเอียด" rows="4" maxlength="5000" class="w-full border rounded px-3 py-2"></textarea>
            </div>

            <div>
                <label class="block mb-1 font-medium">วันที่ขาย ตั้งแต่วันที่-สิ้นสุด</label>
                <div class="flex gap-2">
                    <input type="date" name="startdate" id="startdate" class="border rounded px-3 py-2 w-1/2">
                    <input type="date" name="enddate" id="enddate" class="border rounded px-3 py-2 w-1/2">
                </div>
            </div>

            <div>
                <label for="productimage" class="block mb-1 font-medium">รูปภาพสินค้า</label>
                <input type="file" name="productimage" id="productimage" accept="image/*" class="w-full">
            </div>

            <div class="flex gap-4 mt-4">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">บันทึก</button>
                <button type="reset" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">ล้างข้อมูล</button>
            </div>
        </form>

        <div class="mt-8">
            <p class="font-semibold mb-2">ลูกค้า สามารถ : เลือกซื้อสินค้าได้</p>
            <ul class="list-disc pl-6 text-gray-700">
                <li>กระเป๋า</li>
                <li>แก้วน้ำ</li>
                <li>กระเป๋าผ้า</li>
                <li>ร่ม</li>
                <li>หมวก</li>
            </ul>
        </div>
    </div>
</body>
</html>
